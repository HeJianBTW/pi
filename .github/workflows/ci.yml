name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run JavaScript actions (checkout, setup-node, pnpm/action-setup, etc.) on
  # Node 24 instead of the deprecated Node 20 the runner ships by default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Lint
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - instance-hnpsq9go
      - linux
      - x64
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
      - run: biome check .

  typecheck:
    name: Typecheck
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - instance-hnpsq9go
      - linux
      - x64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pi-build
        with:
          build: 'false'
      - run: pnpm typecheck

  test:
    name: Test
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - instance-hnpsq9go
      - linux
      - x64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pi-build
        with:
          build: 'false'
          install-video-tools: 'true'
      - run: pnpm --filter @amaster.ai/pi-storage prisma:generate
      - run: pnpm --filter @amaster.ai/pi-shared build
      - run: pnpm --filter @amaster.ai/pi-memory build
      - run: pnpm test

  build:
    name: Build
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - instance-hnpsq9go
      - linux
      - x64
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pi-build
      - run: pnpm build
