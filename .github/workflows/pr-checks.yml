name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-checks:
    name: build checks
    runs-on:
      - instance-hnpsq9go
      - linux
      - x64
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack install -g pnpm@10.18.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PR Check
        run: pnpm run pr-check
