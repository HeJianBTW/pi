name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Run JavaScript actions (checkout, setup-node, pnpm/action-setup, etc.) on
  # Node 24 instead of the deprecated Node 20 the runner ships by default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-checks:
    name: build checks
    runs-on:
      - instance-hnpsq9go
      - linux
      - x64
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pi build environment
        uses: ./.github/actions/setup-pi-build
        with:
          build: 'false'
          install-video-tools: 'true'
          prebuild-better-sqlite3: 'true'

      - name: PR Check
        run: pnpm run pr-check
