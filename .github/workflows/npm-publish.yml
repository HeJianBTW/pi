name: Publish npm Packages

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish with
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest
      version_bump:
        description: version bump level; use current for the first release
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack install -g pnpm@10.18.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Ensure release branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "master" ]; then
            echo "Publishing is only allowed from the master branch."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "$GIT_ACTOR"
          git config user.email "${GIT_ACTOR}@users.noreply.github.com"

      - name: Resolve release version from npm and update package versions
        id: versioning
        env:
          RELEASE_CHANNEL: ${{ inputs.npm_tag }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const { execFileSync } = require("node:child_process");

          const channel = process.env.RELEASE_CHANNEL;
          const bump = process.env.VERSION_BUMP;
          if (!channel || !bump) {
            throw new Error("RELEASE_CHANNEL and VERSION_BUMP are required");
          }

          const rootPackageFile = path.join(process.cwd(), "package.json");
          const packagesDir = path.join(process.cwd(), "packages");
          const packageFiles = fs.readdirSync(packagesDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(packagesDir, entry.name, "package.json"))
            .filter((file) => fs.existsSync(file));

          const packageJsonFiles = [rootPackageFile, ...packageFiles];
          const rootPackage = JSON.parse(fs.readFileSync(rootPackageFile, "utf8"));
          const packages = packageFiles.map((file) => ({
            file,
            pkg: JSON.parse(fs.readFileSync(file, "utf8")),
          }));
          const publishablePackages = packages.filter(({ pkg }) => !pkg.private);
          const publishedPackages = publishablePackages.map(({ pkg }) => pkg.name);
          if (publishablePackages.length === 0) {
            throw new Error("No publishable packages found.");
          }

          const localVersion = rootPackage.version;
          if (!localVersion) {
            throw new Error("Root package version is required.");
          }
          const mismatchedLocalVersions = publishablePackages
            .filter(({ pkg }) => pkg.version !== localVersion)
            .map(({ pkg }) => `${pkg.name}@${pkg.version}`);
          if (mismatchedLocalVersions.length > 0) {
            console.warn(
              `Publishable package versions differ from root ${localVersion}; they will be normalized before publishing: ${mismatchedLocalVersions.join(", ")}`
            );
          }

          const parseVersion = (version) => {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/);
            if (!match) {
              throw new Error(`Unsupported version format: ${version}`);
            }
            return {
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3]),
              beta: match[4] === undefined ? null : Number(match[4]),
            };
          };

          const formatStable = ({ major, minor, patch }) => `${major}.${minor}.${patch}`;
          const formatBeta = ({ major, minor, patch, beta }) => `${major}.${minor}.${patch}-beta.${beta}`;
          const compareStable = (left, right) => {
            if (left.major !== right.major) return left.major - right.major;
            if (left.minor !== right.minor) return left.minor - right.minor;
            return left.patch - right.patch;
          };
          const bumpStable = (parsed, level) => {
            if (level === "major") {
              return { major: parsed.major + 1, minor: 0, patch: 0 };
            }
            if (level === "minor") {
              return { major: parsed.major, minor: parsed.minor + 1, patch: 0 };
            }
            if (level === "patch") {
              return { major: parsed.major, minor: parsed.minor, patch: parsed.patch + 1 };
            }
            if (level === "current") {
              return { major: parsed.major, minor: parsed.minor, patch: parsed.patch };
            }
            throw new Error(`Unsupported version bump: ${level}`);
          };

          const npmViewDistTags = (packageName) => {
            try {
              const output = execFileSync("npm", ["view", packageName, "dist-tags", "--json"], {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"],
              }).trim();
              return output ? JSON.parse(output) : {};
            } catch (error) {
              const stderr = error.stderr?.toString?.() ?? "";
              if (stderr.includes("E404")) {
                return null;
              }
              throw new Error(`Failed to read npm dist-tags for ${packageName}: ${stderr || error.message}`);
            }
          };

          const remoteInfos = publishedPackages.map((packageName) => ({
            packageName,
            distTags: npmViewDistTags(packageName),
          }));

          const latestVersions = new Set(
            remoteInfos
              .map((info) => info.distTags?.latest)
              .filter(Boolean)
          );
          const betaVersions = new Set(
            remoteInfos
              .map((info) => info.distTags?.beta)
              .filter(Boolean)
          );

          const allPackagesUnpublished = remoteInfos.every((info) => info.distTags === null);
          if (latestVersions.size > 1) {
            throw new Error(`Expected all npm latest versions to match before publishing, found: ${[...latestVersions].join(", ")}`);
          }
          if (betaVersions.size > 1) {
            throw new Error(`Expected all npm beta versions to match before publishing, found: ${[...betaVersions].join(", ")}`);
          }

          const parsedLocal = parseVersion(localVersion);
          const currentVersion = [...latestVersions][0] ?? null;
          const currentBetaVersion = [...betaVersions][0] ?? null;
          let nextVersion;
          let skipPublish = false;
          let packagesToPublish = publishedPackages;

          if (allPackagesUnpublished) {
            const nextBase = bumpStable(parsedLocal, bump);
            nextVersion = channel === "beta"
              ? formatBeta({ ...nextBase, beta: 0 })
              : formatStable(nextBase);
          } else {
            if (bump === "current") {
              const remotePackagesMissingCurrent = remoteInfos
                .filter((info) => info.distTags !== null && !Object.values(info.distTags).includes(localVersion))
                .map((info) => `${info.packageName} (${Object.values(info.distTags).join(", ")})`);
              if (remotePackagesMissingCurrent.length > 0) {
                throw new Error(
                  `version_bump=current can only resume ${localVersion} or publish packages missing from npm. Remote packages without ${localVersion}: ${remotePackagesMissingCurrent.join(", ")}`
                );
              }
              nextVersion = localVersion;
              packagesToPublish = remoteInfos
                .filter((info) => info.distTags === null)
                .map((info) => info.packageName);
              skipPublish = packagesToPublish.length === 0;
            } else {
              if (!currentVersion) {
                throw new Error("No remote latest version found on npm.");
              }
              const parsedLatest = parseVersion(currentVersion);
              const parsedBeta = currentBetaVersion ? parseVersion(currentBetaVersion) : null;
              const betaAheadOfLatest = parsedBeta ? compareStable(parsedBeta, parsedLatest) > 0 : false;

              if (channel === "beta") {
                if (bump === "patch" && parsedBeta && betaAheadOfLatest) {
                  nextVersion = formatBeta({
                    major: parsedBeta.major,
                    minor: parsedBeta.minor,
                    patch: parsedBeta.patch,
                    beta: parsedBeta.beta + 1,
                  });
                } else {
                  const nextBase = bumpStable(parsedLatest, bump);
                  nextVersion = formatBeta({ ...nextBase, beta: 0 });
                }
              } else if (channel === "latest") {
                if (bump === "patch" && parsedBeta && betaAheadOfLatest) {
                  nextVersion = formatStable(parsedBeta);
                } else {
                  nextVersion = formatStable(bumpStable(parsedLatest, bump));
                }
              } else {
                throw new Error(`Unsupported release channel: ${channel}`);
              }
              packagesToPublish = publishedPackages;
            }
          }

          for (const file of packageJsonFiles) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = nextVersion;
            fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
            console.log(`updated ${pkg.name}: ${pkg.version}`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_version=${nextVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip_publish=${skipPublish ? "true" : "false"}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish_filters=${packagesToPublish.join(" ")}\n`);
          EOF

      - name: Run checks
        run: pnpm run pr-check

      - name: Publish to npm
        if: steps.versioning.outputs.skip_publish != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_cmd=(pnpm publish -r --access public --no-git-checks)
          for package_name in ${{ steps.versioning.outputs.publish_filters }}; do
            publish_cmd+=(--filter "$package_name")
          done
          if [ "${{ inputs.npm_tag }}" = "beta" ]; then
            publish_cmd+=(--tag beta)
          fi
          "${publish_cmd[@]}"

      - name: Commit and tag version changes
        env:
          RELEASE_VERSION: ${{ steps.versioning.outputs.release_version }}
        run: |
          tag_name="v${RELEASE_VERSION}"
          git add package.json packages/*/package.json
          if git diff --cached --quiet; then
            echo "No version changes were staged."
          else
            git commit -m "chore: release ${RELEASE_VERSION}"
          fi
          if git rev-parse "${tag_name}" >/dev/null 2>&1; then
            echo "Tag ${tag_name} already exists locally."
          else
            git tag -a "${tag_name}" -m "${tag_name}"
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "refs/tags/${tag_name}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.versioning.outputs.release_version }}
          RELEASE_CHANNEL: ${{ inputs.npm_tag }}
        run: |
          tag_name="v${RELEASE_VERSION}"
          if gh release view "${tag_name}" >/dev/null 2>&1; then
            echo "GitHub release ${tag_name} already exists."
            exit 0
          fi
          gh release create "${tag_name}" \
            --verify-tag \
            --title "v${RELEASE_VERSION}" \
            --notes "Published npm packages with dist-tag \`${RELEASE_CHANNEL}\`."
